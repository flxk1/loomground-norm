[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loomground-norm"
dynamic = ["version"]
description = "The general normative-reasoning plane: rule extraction, obligation tracking, multi-hop subsumption over loomground-deontic's formula. No governance, no legal domain — both consume this plane, neither is it."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt", "NOTICE"]
authors = [{ name = "Loomground Contributors" }]
# loomground-deontic is the deontic language (three operators O/P/F, the
# Hohfeld incidents, the formula carrier); this plane is the reasoning atop
# it and carries no parallel copy of that language.
# First-party siblings are direct git references, not ranges: no index serves this
# family. Each ref is the release tag loomground's RELEASES.json records, and the full
# transitive closure is declared, because those tagged commits still carry ranges that
# only these URLs can satisfy.
dependencies = [
    "loomground-solver @ git+https://github.com/flxk1/loomground-solver@solver-v0.6.0",
    "loomground-deontic @ git+https://github.com/flxk1/loomground-deontic@loomground-deontic-v0.2.1",
    "loomground-governance @ git+https://github.com/flxk1/loomground-governance@loomground-governance-v0.11.1",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
# Index-resolvable dev deps only; git-pinned unpublished planes live in requirements-dev.txt.
dev = [
    "pytest>=7.0",
]

[project.urls]
Repository = "https://github.com/flxk1/loomground-norm"
Issues = "https://github.com/flxk1/loomground-norm/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["loomground_norm*"]

[tool.setuptools.dynamic]
version = { attr = "loomground_norm._version.__version__" }

[tool.setuptools.package-data]
loomground_norm = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
