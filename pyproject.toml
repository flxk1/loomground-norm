[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loomground-norm"
dynamic = ["version"]
description = "The general normative-reasoning plane: rule extraction, obligation tracking, multi-hop subsumption over loomground-deontic's formula. No governance, no legal domain — both consume this plane, neither is it."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt", "NOTICE"]
authors = [{ name = "Loomground Contributors" }]
# Abstract dependencies only — a name and range, no URL — so the built
# distribution stays index-publishable, matching loomground-solver's own
# dependency on loomground-governance. The `dev` extra pins the concrete git
# revisions for development and CI.
# loomground-deontic is the deontic language (three operators O/P/F, the
# Hohfeld incidents, the formula carrier); this plane is the reasoning atop
# it and carries no parallel copy of that language.
dependencies = [
    # Every consumed symbol (norm_contract.Level/TemporalError,
    # temporal.Date/Duration/RelativeDeadline) ships in 0.2.0 and is still present
    # in 0.5.0. The <0.3 cap was there to keep a shared install resolvable while
    # the family sat on 0.2.x; the family is now moving, so the cap is lifted
    # rather than raised.
    # Verified: the full suite (24 tests) passes against solver 0.5.0.
    "loomground-solver>=0.2,<0.6",
    "loomground-deontic>=0.1,<0.2",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
# Index-resolvable dev deps only; git-pinned unpublished planes live in requirements-dev.txt.
dev = [
    "pytest>=7.0",
]

[project.urls]
Repository = "https://github.com/flxk1/loomground-norm"
Issues = "https://github.com/flxk1/loomground-norm/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["loomground_norm*"]

[tool.setuptools.dynamic]
version = { attr = "loomground_norm._version.__version__" }

[tool.setuptools.package-data]
loomground_norm = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
